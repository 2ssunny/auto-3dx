[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-3dx"
version = "0.1.0"
description = "Python library for driving the 3DEXPERIENCE CATIA Automation object model over Windows COM."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
# The SDK drives COM, which exists only on Windows. `com3dx` is not a dependency: it
# ships with the 3DEXPERIENCE installation and is found at runtime by the transport.
dependencies = ['pywin32; sys_platform == "win32"']

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running 3DEXPERIENCE session",
]
addopts = "-m 'not integration'"

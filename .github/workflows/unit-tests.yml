# Unit tests on standard Windows CPython, without 3DEXPERIENCE.
#
# The unit suite drives fake COM objects and never attaches, reads the com3dx registry
# entry or loads com3dx, so it runs on a stock runner. Live integration tests need a
# running 3DEXPERIENCE session and stay local and opt-in (`-m integration`).
name: unit-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with its test extra
        # A regular (non-editable) install, so the tests import the built package.
        run: python -m pip install ".[test]"
      - name: Run the unit suite
        run: python -m pytest tests/unit -q -p no:cacheprovider
